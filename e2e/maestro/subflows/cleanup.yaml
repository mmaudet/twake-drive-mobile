appId: com.linagora.twakedrive
env:
  FOLDER_NAME: 'E2E-smoke'
---
# Deletes a leftover test folder if it exists (no-op otherwise).
# Device state (bring-up): opening the menu + the "Supprimer" tap (menu) are
# VALIDATED; the "Supprimer le dossier ?" confirmation dialog opens fine.
# ⚠️ The CONFIRMATION TAP still needs to be MADE RELIABLE: during bring-up the taps
# fired (COMPLETED) but the deletion was not committed (folder neither removed from
# Mon Drive, nor present in Corbeille). Leads to explore on device:
#   - Paper Dialog button (tap the clickable container, not the text node);
#   - alternative path: long-press → selection mode → Supprimer action from the banner;
#   - PouchDB replication lag (the server delete may not refresh the list).
- runFlow:
    when:
      visible: '${FOLDER_NAME}'
    commands:
      - tapOn:
          id: 'folder-actions'
          rightOf:
            text: '${FOLDER_NAME}'
      - tapOn: 'Supprimer'
      - assertVisible: 'Supprimer le dossier ?'
      - tapOn:
          text: 'Supprimer'
          rightOf:
            text: 'Annuler'
      - extendedWaitUntil:
          notVisible: '${FOLDER_NAME}'
          timeout: 12000
