appId: com.linagora.twakedrive
tags:
  - inapp
env:
  PREVIEW_FILE: 'sample.jpg'
---
# ⚠️ NOT validated on the current build. Requires:
#   (a) an accessible image fixture ${PREVIEW_FILE} (the test account root
#       only had folders → drop in an image or point to a known file);
#   (b) a FRESH BUILD with the testID `preview-image`: the preview screen is
#       "chromeless" (image/video/pdf) → no text anchor on the current build.
- runFlow: ../../subflows/openDrive.yaml
- tapOn: '${PREVIEW_FILE}'
- extendedWaitUntil:
    visible:
      id: 'preview-image'
    timeout: 10000
