appId: com.linagora.twakedrive
tags:
  - inapp
env:
  SEARCH_QUERY: 'Rapport'
---
# Search reachable + input (cross-platform testIDs). Assertion on server result
# intentionally omitted (paginated + .includes() → non-deterministic).
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    id: 'appbar-search-button'
- assertVisible:
    id: 'search-input'
- inputText: '${SEARCH_QUERY}'
- assertVisible: '${SEARCH_QUERY}'
