appId: com.linagora.twakedrive
tags:
  - inapp
env:
  FOLDER: 'E2Eoff'
  MENU_SUFFIX: ''
---
# Offline: pin → the menu shows "Retirer du hors-ligne" (pinned) → unpin → the menu
# shows "Garder hors-ligne" again. (The local PURGE of the blobs on unpin is covered by
# the OfflineFilesStore unit test — the E2E cannot inspect the filesystem.)
- runFlow: ../../subflows/openDrive.yaml
- tapOn: { id: 'drive-fab' }
- tapOn: 'Nouveau dossier'
- inputText: '${FOLDER}'
- pressKey: Enter
- extendedWaitUntil: { visible: '${FOLDER}', timeout: 20000 }
- tapOn: { id: 'folder-actions:${FOLDER}${MENU_SUFFIX}' }
- waitForAnimationToEnd
- tapOn: 'Garder hors-ligne'
- tapOn: { id: 'folder-actions:${FOLDER}${MENU_SUFFIX}' }
- waitForAnimationToEnd
- assertVisible: 'Retirer du hors-ligne'
- tapOn: 'Retirer du hors-ligne'
- tapOn: { id: 'folder-actions:${FOLDER}${MENU_SUFFIX}' }
- waitForAnimationToEnd
- assertVisible: 'Garder hors-ligne'
- tapOn: 'Supprimer'
- waitForAnimationToEnd
- tapOn: { id: 'confirm-delete-submit' }
