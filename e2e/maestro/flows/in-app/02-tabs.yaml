appId: com.linagora.twakedrive
tags:
  - inapp
---
# Tabs by regex ('<Tab>.*' matches iOS "Récents, tab, 3 of 7" + Android "Récents").
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    text: 'Récents.*'
- tapOn:
    text: 'Favoris.*'
- tapOn:
    text: 'Corbeille.*'
- tapOn:
    text: 'Mon Drive.*'
# The tab bar always shows "Mon Drive" (the regex tolerates the iOS suffix).
- extendedWaitUntil:
    visible:
      text: 'Mon Drive.*'
    timeout: 8000
