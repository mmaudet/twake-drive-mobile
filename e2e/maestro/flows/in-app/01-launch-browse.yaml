appId: com.linagora.twakedrive
tags:
  - inapp
env:
  TEST_FOLDER: 'LINAGORA'
---
# Cross-platform. On iOS the folder has the accessibility "<name>, <localized
# actions label>" (e.g. "Actions du dossier" in FR) → the regex '${TEST_FOLDER}.*'
# matches iOS AND Android because it only anchors on the name, never on that label
# (now localized: NEVER select it by text — the actions button is targeted by
# testID id: 'folder-actions'). Back via the testID appbar-back-button (iOS has
# no hardware back button).
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    text: '${TEST_FOLDER}.*'
- tapOn:
    id: 'appbar-back-button'
- runFlow: ../../subflows/assertLoggedIn.yaml
