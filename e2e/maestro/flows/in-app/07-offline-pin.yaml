appId: com.linagora.twakedrive
tags:
  - inapp
env:
  PIN_TARGET: 'Notes'
---
# Selectors: the folder actions button is targeted by testID
# (id: 'folder-actions', language-independent); "Garder hors-ligne" /
# "Retirer du hors-ligne" remain FR labels VALIDATED on device. Assertion
# by menu state change (text-based), so device-ready WITHOUT a fresh build
# (does not use the pinned-badge testID).
#
# ⚠️ Pinning TRIGGERS A DOWNLOAD of the content: point PIN_TARGET at a
# SMALL folder (or a file). The flow pins then immediately unpins.
- runFlow: ../../subflows/openDrive.yaml
# Pin
- tapOn:
    id: 'folder-actions'
    rightOf:
      text: '${PIN_TARGET}'
- tapOn: 'Garder hors-ligne'
# The state has toggled: the menu now offers "Retirer du hors-ligne"
- tapOn:
    id: 'folder-actions'
    rightOf:
      text: '${PIN_TARGET}'
- extendedWaitUntil:
    visible: 'Retirer du hors-ligne'
    timeout: 10000
# Restore (unpin)
- tapOn: 'Retirer du hors-ligne'
