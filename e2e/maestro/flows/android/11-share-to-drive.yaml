appId: com.google.android.apps.nbu.files
tags:
  - android
---
# ⚠️ DISCOVERY on device required. run-android.sh already pushes
# /sdcard/Pictures/E2E/sample.jpg. Open a deterministic gallery (recommended:
# "Files" com.google.android.apps.nbu.files), share the image to "Twake Drive",
# then confirm the in-app import.
#
# The in-app QUEUE is deterministic: the import flow ends with the
# "Importer ici" button (FolderPicker, testID folder-picker-confirm on a fresh build) →
# "Fichier importé" snackbar (auto-dismiss ~600 ms → we assert the closing of
# the import screen rather than the snackbar).
- launchApp
- tapOn:
    text: 'sample.jpg'
    optional: true
- tapOn:
    text: 'Partager|Share'
- tapOn: 'Twake Drive'
# --- inside the Twake app (import flow) ---
- tapOn: 'Importer ici'
- assertNotVisible: 'Importer ici'
