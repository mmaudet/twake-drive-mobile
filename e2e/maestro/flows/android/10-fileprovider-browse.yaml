appId: com.google.android.apps.nbu.files
tags:
  - android
env:
  PROVIDER_LABEL: 'Twake Drive'
  EXPECT_FOLDER: 'LINAGORA'
---
# Cross-app File Provider (SAF / DocumentsProvider). DEVICE-VALIDATED on Pixel via
# « Files by Google »: Home → « Autre espace de stockage » → « Twake Drive »
# → the REAL drive content is shown (folders listed cross-app).
#
# Prerequisite: Twake app LOGGED IN — the provider root appears ONLY if a
# session is active (queryRoots returns 0 rows without creds, cf. native).
# ${EXPECT_FOLDER} must be a real folder at the drive root.
- launchApp
- tapOn: 'Autre espace de stockage'
- tapOn: '${PROVIDER_LABEL}'
- assertVisible: '${EXPECT_FOLDER}'
