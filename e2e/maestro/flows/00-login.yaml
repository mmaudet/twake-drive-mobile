appId: com.linagora.twakedrive
tags:
  - login
env:
  COZY_EMAIL: 'moi@example.com'
---
# Semi-manual. Tag `login` → EXCLUDED from auto runs. Used to create the
# pre-auth session. Welcome/login selectors confirmed from the source (FR).
#
# The flow drives: welcome → « Se connecter » → email entry → « Continuer »,
# then marks a PAUSE during the OIDC login (password + email code) that you
# perform by hand in the browser/webview, and waits for arrival on the drive.
- launchApp
- assertVisible: 'Bienvenue sur Twake Drive'   # welcome screen (logged out)
- tapOn: 'Se connecter'
- tapOn: 'Adresse email'                         # focus the email field
- inputText: '${COZY_EMAIL}'
- tapOn: 'Continuer'
# --- PAUSE: manual OIDC login (password + email code) ---
- extendedWaitUntil:
    visible: 'Mon Drive'
    timeout: 300000
